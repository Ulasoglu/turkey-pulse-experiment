name: Turkey Pulse Feed Refresh

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "export_feed_data.py"
      - ".github/workflows/feed-refresh.yml"

permissions:
  contents: write

concurrency:
  group: turkey-pulse-feed-refresh
  cancel-in-progress: true

jobs:
  refresh-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Export province feed data
        run: python export_feed_data.py

      - name: Commit province feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/feed.json
          if git diff --cached --quiet; then
            echo "Province feed already up to date."
            exit 0
          fi
          git commit -m "chore: refresh province news feed"
          git pull --rebase origin main
          git push origin main
