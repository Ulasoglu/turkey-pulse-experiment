name: Turkey Pulse Collector

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: turkey-pulse-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run collector
        run: python -u run_collector_guarded.py

      - name: Collect ECMWF weather signals
        run: python -u collect_ecmwf_weather.py

      - name: Prepare effective municipal registry
        run: python -u prepare_municipal_registry.py

      - name: Collect generic municipal news
        run: python -u collect_municipal_news_generic_only.py

      - name: Collect Adapter 2 municipal news
        run: python -u collect_municipal_news_adapter2.py

      - name: Filter signals
        run: python run_filter_prepared_registry.py

      - name: Run signal engine
        run: python signal_engine.py

      - name: Cluster events
        run: python event_cluster.py

      - name: Export web data
        run: python export_web_data.py

      - name: Apply final web quality gate
        run: python web_quality_gate.py

      - name: Restore generated municipal registry
        run: git restore municipal_sources.json

      - name: Commit collected data
        run: |
          if [ ! -f data/raw_signals.jsonl ]; then
            echo "No raw dataset created - nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw_signals.jsonl data/filtered_signals.jsonl data/map_signals.jsonl data/clustered_events.jsonl data/ecmwf_weather_candidates.jsonl web/data/signals.json
          if git diff --cached --quiet; then
            echo "No new data to commit."
            exit 0
          fi
          git commit -m "chore: collect, score and export Turkey pulse signals"
          echo "Cleaning non-data runtime changes before rebase..."
          git status --short
          git restore .
          git pull --rebase origin main
          git push origin main
