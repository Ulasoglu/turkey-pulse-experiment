name: Turkey Pulse Collector

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: turkey-pulse-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run collector
        run: python collector.py

      - name: Filter signals
        run: python filter_signals.py

      - name: Run signal engine
        run: python signal_engine.py

      - name: Cluster events
        run: python event_cluster.py

      - name: Commit collected data
        run: |
          if [ ! -f data/raw_signals.jsonl ]; then
            echo "No raw dataset created - nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw_signals.jsonl data/filtered_signals.jsonl data/map_signals.jsonl data/clustered_events.jsonl
          if git diff --cached --quiet; then
            echo "No new data to commit."
            exit 0
          fi
          git commit -m "chore: collect, filter, score and cluster Turkey pulse signals"
          git pull --rebase origin main
          git push origin main
