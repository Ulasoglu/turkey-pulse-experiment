name: Build Bursa TEST Feed

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lightweight dependencies
        run: python -m pip install requests==2.32.3 beautifulsoup4==4.12.3
      - name: Collect DHA Bursa
        run: python -u probe_dha_bursa_test_only.py
      - name: Collect IHA Bursa
        run: python -u probe_iha_bursa_test_only.py
      - name: Collect AA Bursa
        run: python -u probe_aa_bursa_test_only.py
      - name: Cluster into one Bursa feed
        run: python -u build_bursa_test_feed.py
