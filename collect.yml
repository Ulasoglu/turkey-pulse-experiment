name: Collect zero-euro signals

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt
      - run: python collector.py

      - name: Commit changed observations
        run: |
          git config user.name "turkey-pulse-bot"
          git config user.email "turkey-pulse-bot@users.noreply.github.com"
          git add -- data/raw_signals.jsonl
          if git diff --cached --quiet; then
            echo "No new observations."
          else
            git commit -m "data: collect source observations"
            git push
          fi
