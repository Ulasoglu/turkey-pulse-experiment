<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Turkey Pulse · Bursa TEST</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#15171a;font-family:system-ui,-apple-system,sans-serif}.top{position:sticky;top:0;z-index:2;background:#fff;border-bottom:1px solid #e6e8eb;padding:14px 16px}.brand{font-weight:850;font-size:18px}.brand b{color:#e63946}.place{display:flex;justify-content:space-between;align-items:end;margin-top:12px}.place h1{font-size:28px;margin:0}.place span{font-size:12px;color:#6b7280}.wrap{max-width:640px;margin:auto}.notice{margin:12px 12px 4px;padding:10px 12px;border-radius:12px;background:#fff3cd;font-size:12px;color:#6b5410}.stats{padding:12px 14px;color:#6b7280;font-size:13px}.feed{padding:0 12px 30px}.card{background:#fff;border-radius:18px;overflow:hidden;margin-bottom:14px;box-shadow:0 1px 5px #00000012}.photo{width:100%;aspect-ratio:16/9;object-fit:cover;background:#ddd;display:block}.body{padding:13px 14px 15px}.meta{display:flex;gap:7px;align-items:center;flex-wrap:wrap;font-size:12px;color:#6b7280}.source{font-weight:750;color:#30343b}.multi{background:#e9f7ef;color:#167447;padding:3px 7px;border-radius:99px;font-weight:700}.title{font-size:18px;line-height:1.27;font-weight:800;margin:8px 0 10px}.open{font-size:13px;font-weight:750;color:#d62839;text-decoration:none}.empty{padding:50px 20px;text-align:center;color:#6b7280}.broken{display:none}</style></head><body><div class="wrap"><header class="top"><div class="brand">TURKEY <b>PULSE</b></div><div class="place"><h1>Bursa</h1><span>Şimdi şehirde</span></div></header><div class="notice">TEST ONLY · Ajans görselleri yalnızca ürün doğrulama amacıyla uzaktan gösterilir; yeniden barındırılmaz.</div><div id="stats" class="stats">Yükleniyor…</div><main id="feed" class="feed"></main></div><script>
const esc=s=>(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function when(x){if(!x)return 'Saat bilgisi yok';const d=new Date(x);return isNaN(d)?x:d.toLocaleString('tr-TR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});}
fetch('data/bursa-test-feed.json?ts='+Date.now()).then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{document.getElementById('stats').textContent=`${d.event_count} olay · ${d.raw_items} ham haber`;const f=document.getElementById('feed');f.innerHTML=d.events.map(e=>`<article class="card">${e.image_url?`<img class="photo" src="${esc(e.image_url)}" alt="" loading="lazy" onerror="this.className='broken'">`:''}<div class="body"><div class="meta"><span class="source">${esc((e.sources||[]).join(' + '))}</span><span>·</span><span>${esc(when(e.published_at))}</span>${e.source_count>1?`<span class="multi">${e.source_count} kaynak</span>`:''}</div><div class="title">${esc(e.title)}</div>${e.source_url?`<a class="open" href="${esc(e.source_url)}" target="_blank" rel="noopener">Kaynağa git →</a>`:''}</div></article>`).join('')||'<div class="empty">Henüz haber yok.</div>';}).catch(()=>{document.getElementById('stats').textContent='Test verisi henüz oluşturulmadı.';document.getElementById('feed').innerHTML='<div class="empty">Önce Bursa test workflow’unu çalıştır.</div>';});
</script></body></html>
